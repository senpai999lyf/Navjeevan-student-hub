<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navjeevan Student Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="brand">
                <div class="brand-logo">N</div>

                <div>
                    <h1>Navjeevan</h1>
                    <p>Student Hub</p>
                </div>
            </div>

            <div class="welcome">
                <p class="small-title">STUDENT PORTAL</p>

                <h2>Welcome back.</h2>

                <p>
                    Your classes, timetable, syllabus, assignments
                    and academic progress — all in one place.
                </p>
            </div>

            <form class="login-form">

                <label for="student-id">Student ID</label>

                <input
                    type="text"
                    id="student-id"
                    placeholder="Enter your Student ID"
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

                <button type="button" id="login-btn">
                    Enter Student Hub →
                </button>

            </form>

            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
            >
                <span id="theme-icon">☾</span>
                <span id="theme-text">Dark</span>
            </button>

            <div class="footer">
                <p>Navjeevan Education Society's College of Engineering</p>
                <span>B.Tech • 2026–27</span>
            </div>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
